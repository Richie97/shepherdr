name: TestFlight

# One pipeline: CI tests every push; when CI passes on main and the app
# changed since the last upload, this archives and uploads to TestFlight.
# Run it from the Actions tab to upload the current main regardless.
#
# The last uploaded commit is marked with the tag `testflight-uploaded`, so a
# merge of several commits (or a change after a failed upload) still ships.
#
# Repository secrets (an App Store Connect API key, role Admin, or App Manager
# with access to certificates/profiles, so cloud signing can sign the build):
#   ASC_KEY_ID      the key's ID
#   ASC_ISSUER_ID   the issuer ID shown above the keys list
#   ASC_KEY_P8      the full contents of AuthKey_<id>.p8
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: write # to move the testflight-uploaded tag

jobs:
  gate:
    name: Decide
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      upload: ${{ steps.decide.outputs.upload }}
      sha: ${{ steps.decide.outputs.sha }}
      build: ${{ steps.decide.outputs.build }}
      notes: ${{ steps.decide.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - id: decide
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "build=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
          # "What to Test": commit subjects since the last upload (or the last 10).
          range=$(git rev-parse -q --verify refs/tags/testflight-uploaded >/dev/null && echo "testflight-uploaded..$sha" || echo "-10 $sha")
          { echo "notes<<NOTES_EOF"
            echo "Changes in this build:"
            git log --no-merges --format='• %s' $range -- | head -30
            echo "NOTES_EOF"; } >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual run: uploading $sha"; echo "upload=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git rev-parse -q --verify refs/tags/testflight-uploaded >/dev/null; then
            echo "No previous upload: uploading $sha"; echo "upload=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet testflight-uploaded "$sha" -- ios/; then
            echo "ios/ unchanged since $(git rev-parse --short testflight-uploaded): skipping"
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "ios/ changed since $(git rev-parse --short testflight-uploaded):"
            git diff --stat testflight-uploaded "$sha" -- ios/ | tail -5
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

  upload:
    name: Archive and upload
    needs: gate
    if: needs.gate.outputs.upload == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - name: Write API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          test -n "$ASC_KEY_P8" || { echo "::error::ASC_KEY_P8 secret is not set"; exit 1; }
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Check API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: python3 ios/scripts/testflight_distribute.py --check
      - name: Archive and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD_NUMBER: ${{ needs.gate.outputs.build }}
        run: ios/scripts/testflight.sh
      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
      - name: Mark as uploaded
        run: |
          git tag -f testflight-uploaded "${{ needs.gate.outputs.sha }}"
          git push -f origin refs/tags/testflight-uploaded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-logs
          path: ios/build/testflight/*.log
          if-no-files-found: ignore

  distribute:
    name: Add to Internal group
    needs: [gate, upload]
    runs-on: ubuntu-latest # waiting on Apple's processing is cheaper here than on macOS
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - name: Write API key and notes
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          NOTES: ${{ needs.gate.outputs.notes }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.txt"
          cat "$RUNNER_TEMP/notes.txt"
      - name: Wait for processing, set notes, add to group
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 ios/scripts/testflight_distribute.py --build "${{ needs.gate.outputs.build }}" \
            --group Internal --notes-file "$RUNNER_TEMP/notes.txt"
      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
