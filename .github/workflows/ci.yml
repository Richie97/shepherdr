name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    name: Bridge (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: go test ./...

  ios:
    name: iOS app
    runs-on: xcode-27
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Check App Store listing (lengths, screenshot sizes)
        run: python3 scripts/appstore_sync.py --check
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Test
        run: |
          sim=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9A-Za-z ]+[0-9A-Za-z]' )
          echo "simulator: $sim"
          # Boot first: a cold simulator can time out the UI test's app launch.
          xcrun simctl bootstatus "$sim" -b > /dev/null
          xcodebuild test -scheme Shepherdr -destination "platform=iOS Simulator,name=$sim" \
            -derivedDataPath build -skipPackagePluginValidation \
            -retry-tests-on-failure -test-iterations 2 | tail -20
          exit ${PIPESTATUS[0]}
