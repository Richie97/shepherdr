name: Shepherdr
options:
  bundleIdPrefix: app.shepherdr
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.99.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: L3NS86NMXZ
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Shepherdr:
    type: application
    platform: iOS
    sources:
      - Shepherdr
    dependencies:
      - package: SwiftTerm
    info:
      path: Shepherdr/Info.plist
      properties:
        CFBundleDisplayName: Shepherdr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only HTTPS/TLS (exempt): skips the export-compliance prompt on upload.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.developer-tools
        NSCameraUsageDescription: Scan the pairing QR code your hub shows.
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        CFBundleURLTypes:
          - CFBundleURLName: app.shepherdr
            CFBundleURLSchemes: [shepherdr]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.shepherdr
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Shepherdr/Shepherdr.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ShepherdrTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ShepherdrTests
      - path: ../bridge/testdata
        type: folder
        buildPhase: resources
    dependencies:
      - target: Shepherdr
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Shepherdr:
    build:
      targets:
        Shepherdr: all
        ShepherdrTests: [test]
    test:
      targets:
        - ShepherdrTests
